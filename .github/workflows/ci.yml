name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: build, test, and package
        run: bash scripts/package_release.sh
      - name: verify package checksum
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
